{% extends "cinema/base.html" %}

{% block content %}
  <h1>Добавить фильм или сериал</h1>

  {% if messages %}
    {% for message in messages %}
      <p>{{ message }}</p>
    {% endfor %}
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <p>
      <label>Название:</label><br>
      <input type="text" name="title" placeholder="Игра в осьминога" required>
    </p>
    <p>
      <label>Slug (латиницей через дефис):</label><br>
      <input type="text" name="slug" placeholder="igra-v-osminoga" required>
    </p>
    <p>
      <label>Оригинальное название:</label><br>
      <input type="text" name="original_title" placeholder="Octopus Game">
    </p>
    <p>
      <label>Слоган:</label><br>
      <input type="text" name="tagline">
    </p>
    <p>
      <label>Описание:</label><br>
      <textarea name="description" rows="4"></textarea>
    </p>
    <p>
      <label>Год выхода:</label><br>
      <input type="number" name="release_year">
    </p>
    <p>
      <label>Страна:</label><br>
      <input type="text" name="country">
    </p>
    <p>
      <label>Длительность:</label><br>
      <input type="text" name="duration">
    </p>
    <p>
      <label>Возрастной рейтинг:</label><br>
      <input type="text" name="age_rating" placeholder="16+">
    </p>
    <p>
      <label>Постер:</label><br>
      <input type="file" name="poster" accept="image/*">
    </p>
    <p>
      <label>
        <input type="checkbox" name="is_published" checked> Опубликован
      </label>
    </p>
    <button type="submit">Создать</button>
  </form>
{% endblock %}
