<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Кинопоиск{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #141414; color: #f2f2f2; }
    a { color: #ff6600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { background: #1f1f1f; border-bottom: 1px solid #2e2e2e; padding: 14px 24px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    .logo { font-size: 20px; font-weight: 900; color: #ff6600; letter-spacing: .5px; text-decoration: none !important; }
    header input[type="text"] { padding: 8px 12px; width: 320px; border: 1px solid #383838; background: #2a2a2a; color: #fff; border-radius: 8px; }
    header button, .btn { padding: 8px 14px; border: none; background: #ff6600; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .btn-dark { padding: 7px 12px; border: 1px solid #444; background: #262626; color: #fff; border-radius: 8px; cursor: pointer; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    .card { background: #1f1f1f; padding: 16px; border-radius: 12px; border: 1px solid #2c2c2c; }
    .msg { background: #2b2218; border-left: 4px solid #ff6600; padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
    .rating-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-weight: bold; font-size: 13px; color: #fff; background: #666; }
    .rating-high { background: #3bb33b; }
    #toast-box { position: fixed; right: 20px; bottom: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: #ff6600; color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>
<header>
  <a href="{% url 'catalog' %}" class="logo">КИНОПОИСК</a>
  <a href="{% url 'catalog' %}?type=movie" style="color:#fff;">Фильмы</a>
  <a href="{% url 'catalog' %}?type=series" style="color:#fff;">Сериалы</a>
  <a href="{% url 'catalog' %}?type=anime" style="color:#fff;">Аниме</a>

  <form method="get" action="{% url 'catalog' %}" style="display:flex; gap:8px;">
    <input type="text" name="q" value="{{ query|default:'' }}" placeholder="Фильмы, сериалы, аниме...">
    <button type="submit">Найти</button>
  </form>

  <div style="margin-left:auto; display:flex; gap:14px; align-items:center;">
    {% if user.is_authenticated %}
      <a href="{% url 'profile' %}" style="color:#fff;">Буду смотреть / Профиль ({{ user.username }})</a>
      <form method="post" action="{% url 'logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn-dark">Выйти</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" style="color:#fff;">Войти</a>
      <a href="{% url 'register' %}" class="btn">Регистрация</a>
    {% endif %}
  </div>
</header>

<div class="container">
  {% for message in messages %}
    <div class="msg">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>

<div id="toast-box"></div>

<script>
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return '';
  }

  function showToast(text) {
    const box = document.getElementById('toast-box');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = text;
    box.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }

  document.addEventListener('click', async (event) => {
    const btn = event.target.closest('.js-watchlist');
    if (!btn) return;
    event.preventDefault();
    btn.disabled = true;
    try {
      const response = await fetch(btn.dataset.url, {
        method: 'POST',
        headers: {
          'X-CSRFToken': getCookie('csrftoken'),
          'X-Requested-With': 'XMLHttpRequest',
        },
      });
      const data = await response.json();
      if (data.ok) {
        btn.textContent = data.added ? '✓ В списке' : '+ Буду смотреть';
      }
      if (data.message) showToast(data.message);
    } catch (e) {
      showToast('Ошибка соединения с сервером.');
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
